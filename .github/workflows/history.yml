name: History

# Long H1 price history from Dukascopy (FX, gold, US indices since 2012) -> data/history/*.csv.gz
# Weekly, an hour before the Saturday research; or Actions -> History -> Run workflow.
# NOTE (26 Oct 2026): Dukascopy answers GitHub's servers with 403 (bot wall), so the schedule is off and the long
# history comes from export_mt5_history.bat on a home PC instead. Kept for a manual retry.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "ว่าง = ทุกสินทรัพย์ หรือใส่ เช่น XAUUSD US500"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tradinglab
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: .dukascopy-cache
          key: dukascopy-${{ github.run_id }}
          restore-keys: dukascopy-

      - run: npm install --no-save dukascopy-node@1.51.0

      - name: Browser for Dukascopy's bot check
        run: npx dukascopy-node --install-browser --with-deps || echo "browser install failed, trying system Chrome"

      - name: Fetch history
        id: fetch
        continue-on-error: true
        env:
          DEBUG: "dukascopy-node:waf"
        run: node tools/fetch_history.js ${{ inputs.symbols }}

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .dukascopy-cache
          key: dukascopy-${{ github.run_id }}

      - name: Commit history (and the fetch log, also on failure)
        if: always()
        run: |
          git config user.name "tradinglab-bot"
          git config user.email "tradinglab-bot@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "history: Dukascopy H1 [skip ci]"
          git pull --rebase -X theirs origin main || true
          git push
