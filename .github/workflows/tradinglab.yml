name: TradingLab

on:
  schedule:
    - cron: "4 * * * *"     # every hour, just after the H1 candle closes: scan + alerts + site
    - cron: "30 2 * * 6"    # Saturday 09:30 Bangkok (FX closed): full auto research
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = สแกนสัญญาณ · research = วิจัยใหม่ทั้งหมด (WF + robustness + Monte Carlo)"
        type: choice
        options: [research, scan]
        default: research
  push:
    branches: [main]
    paths: ["app/**", "web/**", "data/research/**", "data/settings.json", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tradinglab
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TL_ACCOUNT_BALANCE: ${{ vars.ACCOUNT_BALANCE }}
      TL_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Run
        run: |
          MODE="scan"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          if [ "${{ github.event.schedule }}" = "30 2 * * 6" ]; then MODE="research"; fi
          if [ "${{ github.event_name }}" = "push" ]; then MODE="build"; fi
          echo "mode=$MODE"
          python -m app.cloud "$MODE"

      - name: Save price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}

      - name: Commit signals / research
        run: |
          git config user.name "tradinglab-bot"
          git config user.email "tradinglab-bot@users.noreply.github.com"
          git add data/signals.json data/research
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "cloud: update signals/research [skip ci]"
          git pull --rebase -X theirs origin main || true
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
