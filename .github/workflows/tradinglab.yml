name: TradingLab

on:
  schedule:
    # scan + alerts + site every 10 minutes: GitHub delays scheduled runs by 25-45 min at busy times, so a single
    # ":04" trigger pushed signals ~40 min after the candle closed. Frequent triggers mean one runs soon after each close;
    # the scan is idempotent (one signal per system and bar), extra runs just find nothing new.
    - cron: "1,11,21,31,41,51 * * * *"
    - cron: "30 2 1 1 *"    # 1 Jan 09:30 Bangkok: YEARLY research (user, 9 Nov 2026: same rhythm as the 12-month OOS folds)
    - cron: "30 2 * * 6"    # Saturday 09:30 Bangkok: safety net — research ONLY if this year's run is still missing
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = สแกนสัญญาณ · research = วิจัยใหม่ทั้งหมด (WF + robustness + Monte Carlo) · test = ส่งแจ้งเตือนทดสอบ"
        type: choice
        options: [research, scan, test, merge]
        default: research
      from_run:
        description: "merge = judge the research parts of an earlier run again (its run id) without re-testing"
        type: string
        default: ""
      variant:
        description: "research: normal = ผลที่ใช้เทรด · swap = รอบเทียบแบบหัก swap (ไม่แทนผลจริง เขียนลง data/research/compare/)"
        type: choice
        options: [normal, swap]
        default: normal
      artifact_ids:
        description: "merge: comma-separated artifact ids (the cross-run artifact list stops at 200)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["app/**", "web/**", "data/research/**", "data/settings.json", "data/history/**", "data/exness/swap_charged.json", "data/signals.json", ".github/workflows/**"]

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

# One queue for hourly scans / site builds (a newer queued one replaces an older queued one — fine for scans).
# Research runs (button, Saturday, new history pushed) get their own group so a queued scan can never cancel them.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * 6' || github.event.schedule == '30 2 1 1 *' || contains(toJSON(github.event.commits), 'data/history/') || contains(toJSON(github.event.commits), 'swap_charged') || contains(github.event.head_commit.message, '[research]')) && format('tradinglab-research-{0}', github.run_id) || 'tradinglab' }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- what to do, and (research) fetch prices once
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.m.outputs.mode }}
    env:
      TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
      PYTHONWARNINGS: ignore
    steps:
      - id: m
        run: |
          MODE="scan"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          if [ "${{ github.event.schedule }}" = "30 2 * * 6" ] || [ "${{ github.event.schedule }}" = "30 2 1 1 *" ]; then MODE="due"; fi
          if [ "${{ github.event_name }}" = "push" ]; then MODE="build"; fi
          # new long price history pushed from the PC (export_mt5_history.bat): research it right away
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ contains(toJSON(github.event.commits), 'data/history/') }}" = "true" ]; then MODE="research"; fi
          # the PC saw the account pay swap (data/exness/swap_charged.json): research again, now charging swap
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ contains(toJSON(github.event.commits), 'swap_charged') }}" = "true" ]; then MODE="research"; fi
          # the PC asks for a research run in its commit message (9 Nov 2026: API commits carry no file list in the event)
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ contains(github.event.head_commit.message, '[research]') }}" = "true" ]; then MODE="research"; fi
          if [ "$MODE" = "due" ]; then
            # research runs once a year (cut-off = 1 Jan 00:00 broker time; Exness = GMT+0)
            curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/main/data/research/latest.json" -o latest.json || true
            MODE=$(python3 - <<'PY'
          import json, datetime as dt
          from zoneinfo import ZoneInfo
          now = dt.datetime.now(dt.timezone.utc)
          cut = dt.datetime(now.year, 1, 1, tzinfo=dt.timezone.utc)
          try:
              gen = dt.datetime.fromisoformat(json.load(open("latest.json"))["generated"])
          except Exception:
              gen = None
          print("research" if gen is None or gen < cut else "scan")
          PY
          )
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"; echo "mode=$MODE"
      - uses: actions/checkout@v4
        if: steps.m.outputs.mode == 'research'
      - uses: actions/setup-python@v5
        if: steps.m.outputs.mode == 'research'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.m.outputs.mode == 'research'
        run: pip install -r requirements.txt
      - name: Restore price cache
        if: steps.m.outputs.mode == 'research'
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Fetch fresh prices once for all research jobs
        if: steps.m.outputs.mode == 'research'
        run: python -m app.cloud prefetch
      - name: Save price cache
        if: steps.m.outputs.mode == 'research'
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}-research

  # ---------------------------------------------------------------- research: every strategy x every step, one job per symbol x TF
  part:
    needs: plan
    if: needs.plan.outputs.mode == 'research'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        symbol: [EURUSD, GBPUSD, USDJPY, GBPJPY, AUDUSD, USDCAD, NZDUSD, USDCHF, EURJPY, AUDJPY, EURGBP, EURAUD,
                 XAUUSD, XAGUSD, XPTUSD, XCUUSD, USOIL, UKOIL, XNGUSD, NAS100, US500, DE30, JP225,
                 NVDA, MSFT, AMZN, META, AAPL, BTCUSD, ETHUSD]
        # 30 symbols x 8 strategy chunks, all 3 TF in each job = 240 jobs (matrix max 256, 6 h job limit)
        chunk: ["0/8", "1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8"]
    env:
      PYTHONWARNINGS: ignore
      TL_OFFLINE: "1"
      TL_SWAP_MODE: ${{ inputs.variant == 'swap' && 'charged' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}-research
          restore-keys: prices-
      - name: Research ${{ matrix.symbol }} ${{ matrix.chunk }}
        run: python -m app.cloud part ${{ matrix.symbol }} ALL ${{ matrix.chunk }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.symbol }}-${{ strategy.job-index }}
          path: data/research/parts/
          retention-days: 3

  # ---------------------------------------------------------------- merge (research) · scan · build site · commit · deploy
  run:
    needs: [plan, part]
    # a cancelled or failed research matrix never reaches the merge (10 Nov 2026: a cancelled run merged partial parts)
    if: ${{ always() && needs.plan.result == 'success' && needs.part.result != 'cancelled' && needs.part.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TL_ACCOUNT_BALANCE: ${{ vars.ACCOUNT_BALANCE }}
      TL_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Research parts
        if: needs.plan.outputs.mode == 'research'
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: data/research/parts
          merge-multiple: true

      - name: Research parts of an earlier run
        if: needs.plan.outputs.mode == 'merge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # every page of the run's artifacts (download-artifact stops at 200 when reading another run)
          mkdir -p data/research/parts && cd data/research/parts
          for page in 1 2 3 4; do
            gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.from_run }}/artifacts?per_page=100&page=$page" \
              --jq '.artifacts[] | select(.name | startswith("part-")) | .id' >> ids.txt
          done
          echo "artifacts: $(wc -l < ids.txt)"
          while read id; do
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > a.zip && unzip -oq a.zip && rm a.zip
          done < ids.txt
          rm ids.txt; ls | wc -l

      - name: Restore system payload cache
        uses: actions/cache/restore@v4
        with:
          path: data/sys_cache
          key: sys-${{ github.run_id }}
          restore-keys: sys-

      - name: Run
        run: |
          MODE="${{ needs.plan.outputs.mode }}"
          if [ "$MODE" = "research" ] || [ "$MODE" = "merge" ]; then MODE="merge"; fi
          # comparison run (variant swap): judge the parts into data/research/compare/ only — live results stay untouched
          if [ "$MODE" = "merge" ] && [ "${{ inputs.variant }}" = "swap" ]; then MODE="compare"; export TL_SWAP_MODE=charged; fi
          echo "mode=$MODE"
          python -m app.cloud "$MODE"
          if [ "$MODE" = "test" ] || [ "$MODE" = "compare" ]; then echo "SKIP_SITE=1" >> "$GITHUB_ENV"; fi

      - name: Save system payload cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/sys_cache
          key: sys-${{ github.run_id }}

      - name: Save price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}

      - name: Commit signals / research
        run: |
          git config user.name "tradinglab-bot"
          git config user.email "tradinglab-bot@users.noreply.github.com"
          # the PC auto-trader may have pushed signals meanwhile: keep both sides (union by signal id), retry on a race
          for i in 1 2 3 4; do
            git fetch -q origin main
            python -m tools.merge_signals origin/main
            git add data/signals.json data/research; git add data/cloud_status.json 2>/dev/null || true
            git checkout -- . 2>/dev/null || true     # drop other edits (pc_status.json copied from origin by the scan) so the rebase can run
            if ! git diff --cached --quiet; then git commit -q -m "cloud: update signals/research [skip ci]"; fi
            if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then echo "nothing to push"; exit 0; fi
            git rebase -X theirs origin/main || { git rebase --abort; git reset -q --soft origin/main; continue; }
            if git push -q origin HEAD:main; then exit 0; fi
          done
          echo "::warning::could not push signals after 4 tries"

      - uses: actions/configure-pages@v5
        if: env.SKIP_SITE != '1'
      - uses: actions/upload-pages-artifact@v3
        if: env.SKIP_SITE != '1'
        with:
          path: site
      - id: deploy
        if: env.SKIP_SITE != '1'
        uses: actions/deploy-pages@v4
