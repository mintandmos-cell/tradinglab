name: TradingLab

on:
  schedule:
    # scan + alerts + site every 10 minutes: GitHub delays scheduled runs by 25-45 min at busy times, so a single
    # ":04" trigger pushed signals ~40 min after the candle closed. Frequent triggers mean one runs soon after each close;
    # the scan is idempotent (one signal per system and bar), extra runs just find nothing new.
    - cron: "1,11,21,31,41,51 * * * *"
    - cron: "30 2 1 1,4,7,10 *"   # 1 Jan / Apr / Jul / Oct 09:30 Bangkok: quarterly research (all systems, same cut-off)
    - cron: "30 2 * * 6"    # Saturday 09:30 Bangkok: safety net — research ONLY if this quarter's run is still missing
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = สแกนสัญญาณ · research = วิจัยใหม่ทั้งหมด (WF + robustness + Monte Carlo) · test = ส่งแจ้งเตือนทดสอบ"
        type: choice
        options: [research, scan, test]
        default: research
  push:
    branches: [main]
    paths: ["app/**", "web/**", "data/research/**", "data/settings.json", "data/history/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

# One queue for hourly scans / site builds (a newer queued one replaces an older queued one — fine for scans).
# Research runs (button, Saturday, new history pushed) get their own group so a queued scan can never cancel them.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * 6' || github.event.schedule == '30 2 1 1,4,7,10 *' || contains(toJSON(github.event.commits), 'data/history/')) && format('tradinglab-research-{0}', github.run_id) || 'tradinglab' }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- what to do, and (research) fetch prices once
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.m.outputs.mode }}
    env:
      TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
      PYTHONWARNINGS: ignore
    steps:
      - id: m
        run: |
          MODE="scan"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          if [ "${{ github.event.schedule }}" = "30 2 * * 6" ] || [ "${{ github.event.schedule }}" = "30 2 1 1,4,7,10 *" ]; then MODE="due"; fi
          if [ "${{ github.event_name }}" = "push" ]; then MODE="build"; fi
          # new long price history pushed from the PC (export_mt5_history.bat): research it right away
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ contains(toJSON(github.event.commits), 'data/history/') }}" = "true" ]; then MODE="research"; fi
          if [ "$MODE" = "due" ]; then
            # research runs once per quarter (cut-off = 1 Jan / 1 Apr / 1 Jul / 1 Oct 00:00 broker time = New York + 7 h)
            curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/main/data/research/latest.json" -o latest.json || true
            MODE=$(python3 - <<'PY'
          import json, datetime as dt
          from zoneinfo import ZoneInfo
          now = dt.datetime.now(dt.timezone.utc)
          srv = now.astimezone(ZoneInfo("America/New_York")).replace(tzinfo=None) + dt.timedelta(hours=7)
          q = dt.datetime(srv.year, (srv.month - 1) // 3 * 3 + 1, 1)
          cut = (q - dt.timedelta(hours=7)).replace(tzinfo=ZoneInfo("America/New_York")).astimezone(dt.timezone.utc)
          try:
              gen = dt.datetime.fromisoformat(json.load(open("latest.json"))["generated"])
          except Exception:
              gen = None
          print("research" if gen is None or gen < cut else "scan")
          PY
          )
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"; echo "mode=$MODE"
      - uses: actions/checkout@v4
        if: steps.m.outputs.mode == 'research'
      - uses: actions/setup-python@v5
        if: steps.m.outputs.mode == 'research'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.m.outputs.mode == 'research'
        run: pip install -r requirements.txt
      - name: Restore price cache
        if: steps.m.outputs.mode == 'research'
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Fetch fresh prices once for all research jobs
        if: steps.m.outputs.mode == 'research'
        run: python -m app.cloud prefetch
      - name: Save price cache
        if: steps.m.outputs.mode == 'research'
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}-research

  # ---------------------------------------------------------------- research: every strategy x every step, one job per symbol x TF
  part:
    needs: plan
    if: needs.plan.outputs.mode == 'research'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        symbol: [EURUSD, GBPUSD, USDJPY, XAUUSD, NAS100, US500, BTCUSD, ETHUSD]
        tf: [H1, H4, D1]
    env:
      PYTHONWARNINGS: ignore
      TL_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}-research
          restore-keys: prices-
      - name: Research ${{ matrix.symbol }} ${{ matrix.tf }}
        run: python -m app.cloud part ${{ matrix.symbol }} ${{ matrix.tf }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.symbol }}-${{ matrix.tf }}
          path: data/research/parts/
          retention-days: 3

  # ---------------------------------------------------------------- merge (research) · scan · build site · commit · deploy
  run:
    needs: [plan, part]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TL_ACCOUNT_BALANCE: ${{ vars.ACCOUNT_BALANCE }}
      TL_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Research parts
        if: needs.plan.outputs.mode == 'research'
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: data/research/parts
          merge-multiple: true

      - name: Run
        run: |
          MODE="${{ needs.plan.outputs.mode }}"
          if [ "$MODE" = "research" ]; then MODE="merge"; fi
          echo "mode=$MODE"
          python -m app.cloud "$MODE"
          if [ "$MODE" = "test" ]; then echo "SKIP_SITE=1" >> "$GITHUB_ENV"; fi

      - name: Save price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}

      - name: Commit signals / research
        run: |
          git config user.name "tradinglab-bot"
          git config user.email "tradinglab-bot@users.noreply.github.com"
          git add data/signals.json data/research
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "cloud: update signals/research [skip ci]"
          git pull --rebase -X theirs origin main || true
          git push

      - uses: actions/configure-pages@v5
        if: env.SKIP_SITE != '1'
      - uses: actions/upload-pages-artifact@v3
        if: env.SKIP_SITE != '1'
        with:
          path: site
      - id: deploy
        if: env.SKIP_SITE != '1'
        uses: actions/deploy-pages@v4
