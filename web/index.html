<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TradingLab">
<title>TradingLab</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/app.css">
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="logo" href="#/chart" data-tip="TradingLab">▲</a>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="sideFoot"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="tb-title"><h1 id="pageTitle">กราฟ</h1><div class="sub" id="pageSub"></div></div>
      <div class="right">
        <span class="row small muted hide-sm" id="statusLine"></span>
        <button class="ibtn" id="refreshBtn" data-tip="โหลดข้อมูลใหม่ทั้งหมด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
        <button class="ibtn" id="themeBtn" data-tip="สลับธีม"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
      </div>
    </header>
    <nav class="mnav" id="mnav"></nav>
    <div id="updateBar"></div>
    <div class="content" id="view"></div>
  </main>
</div>
<script src="config.js"></script>
<script src="static/app.js"></script>
</body>
</html>
